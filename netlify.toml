[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"


[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"
[[redirects]]
force = true
from = "/health"
status = 200
to = "/.netlify/functions/api/health"

[[redirects]]
force = true
from = "/health/ready"
status = 200
to = "/.netlify/functions/api/health/ready"

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"
